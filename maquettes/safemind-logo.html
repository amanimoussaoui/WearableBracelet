<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeMind – Logo</title>
<style>
:root{--bg:#050d08;--g:#6df58a;--g2:#b4ffc6;--tx:#f2fff6;--mut:#7f9a89;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:inherit;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
html,body{min-height:100%}
body{background:radial-gradient(90% 55% at 50% 22%,#12532a 0,var(--bg) 70%);color:var(--tx);display:flex;flex-direction:column;align-items:center;padding:32px 16px;gap:28px}
.hero{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center}
.logo{width:min(260px,70vw);height:auto;overflow:visible}
.ring{fill:none;stroke:var(--g);stroke-width:1.5;transform-origin:100px 100px;opacity:0;animation:ring 2.8s ease-out infinite}
.r2{animation-delay:.9s}.r3{animation-delay:1.8s}
@keyframes ring{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.75);opacity:0}}
.shield{transform-origin:100px 100px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.pin{fill:none;stroke:var(--g2);stroke-width:5;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.3s .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.heart{fill:var(--g);transform-origin:100px 90px;opacity:0;animation:show .4s 1.8s forwards,beat 1.1s 2.2s infinite}
@keyframes show{to{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.dot{fill:var(--g2);opacity:0;animation:show .3s 2.1s forwards}
.name{font-size:46px;font-weight:800;letter-spacing:-1px;margin-top:6px;opacity:0;animation:up .8s 1.5s forwards}
.name b{color:var(--g)}
.tag{color:var(--mut);font-size:15px;opacity:0;animation:up .8s 2s forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hint{font-size:12px;color:var(--mut)}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.card{background:#0d1a12;border:1px solid rgba(109,245,138,.18);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.app{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#7dff9b,#2fbf5c);display:grid;place-items:center}
.app.dark{background:#050d08;border:1px solid rgba(109,245,138,.4)}
</style>
</head>
<body>
<div class="hero" id="hero" title="Cliquer pour rejouer">
  <svg class="logo" viewBox="0 0 200 200" id="lg" role="img" aria-label="Logo SafeMind">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b6b38"/><stop offset="1" stop-color="#07150c"/></linearGradient>
    </defs>
    <circle class="ring" cx="100" cy="100" r="78"/><circle class="ring r2" cx="100" cy="100" r="78"/><circle class="ring r3" cx="100" cy="100" r="78"/>
    <g class="shield">
      <path d="M100 12C128 28 158 33 176 36V100C176 146 140 176 100 192C60 176 24 146 24 100V36C42 33 72 28 100 12Z" fill="url(#sg)" stroke="#6df58a" stroke-width="3"/>
    </g>
    <path class="pin" d="M100 52C78 52 62 69 62 90C62 118 100 150 100 150C100 150 138 118 138 90C138 69 122 52 100 52Z"/>
    <path class="heart" d="M100 106C82 93 82 77 93 74C97 73 100 76 100 79C100 76 103 73 107 74C118 77 118 93 100 106Z"/>
    <circle class="dot" cx="100" cy="162" r="4"/>
  </svg>
  <div class="name">Safe<b>Mind</b></div>
  <div class="tag">Veiller sur ceux qui comptent</div>
</div>
<div class="hint">Cliquez sur le logo pour rejouer l’animation</div>

<div class="row">
  <div class="card"><div class="app" aria-label="Icône verte">
    <svg width="64" height="64" viewBox="0 0 200 200"><path d="M100 12C128 28 158 33 176 36V100C176 146 140 176 100 192C60 176 24 146 24 100V36C42 33 72 28 100 12Z" fill="#05150b"/><path d="M100 52C78 52 62 69 62 90C62 118 100 150 100 150C100 150 138 118 138 90C138 69 122 52 100 52Z" fill="none" stroke="#b4ffc6" stroke-width="6"/><path d="M100 106C82 93 82 77 93 74C97 73 100 76 100 79C100 76 103 73 107 74C118 77 118 93 100 106Z" fill="#6df58a"/></svg>
  </div>Icône d’app</div>
  <div class="card"><div class="app dark">
    <svg width="64" height="64" viewBox="0 0 200 200"><path d="M100 12C128 28 158 33 176 36V100C176 146 140 176 100 192C60 176 24 146 24 100V36C42 33 72 28 100 12Z" fill="#0d2a17" stroke="#6df58a" stroke-width="5"/><path d="M100 52C78 52 62 69 62 90C62 118 100 150 100 150C100 150 138 118 138 90C138 69 122 52 100 52Z" fill="none" stroke="#b4ffc6" stroke-width="6"/><path d="M100 106C82 93 82 77 93 74C97 73 100 76 100 79C100 76 103 73 107 74C118 77 118 93 100 106Z" fill="#6df58a"/></svg>
  </div>Variante sombre</div>
</div>
<script>
function replay(){const h=document.getElementById('hero'),c=h.cloneNode(true);h.replaceWith(c);c.onclick=replay;}
document.getElementById('hero').onclick=replay;
</script>
</body>
</html>
